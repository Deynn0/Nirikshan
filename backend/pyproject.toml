[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nirikshan"
version = "0.1.0"
description = "Offline-first, explainable document verification system for AICTE regulatory scrutiny"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary / AICTE Internal" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "pyyaml>=6.0.1",
    "pypdf>=4.1.0",
    "pillow>=10.2.0",
    "cryptography>=42.0.5",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "reportlab>=4.1.0",
    "rapidfuzz>=3.0.0",
    "pyhanko>=0.38.0",
    "shapely>=2.0.0",
    "c2pa-python>=0.38.0",
    "qrcode>=8.0",
    "segno>=1.6.0",
    "fonttools>=4.50.0",
    "onnxruntime>=1.17.0",
    "networkx>=3.0",
    "imagehash>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12.20240311",
    "types-aiofiles>=23.2.0.20240311",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

