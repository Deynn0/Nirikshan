    category: "Safety & Compliance"
    severity: "CRITICAL"
    citation:
      handbook: "AICTE Approval Process Handbook 2024-2027"
      clause: "Clause 6.1"
      page: 60
      edition: "2024-2027"
      needs_verification: false
    description: "Valid Fire Safety Certificate issued by State Fire Services with unexpired validity."
    required_document_types:
      - "FIRE_SAFETY_NOC"

  - id: "AICTE-2024-SAFE-002"
    name: "Barrier Free Accessibility for Divyangjan"
    category: "Safety & Compliance"
    severity: "MEDIUM"
    citation:
      handbook: "AICTE Approval Process Handbook 2024-2027"
      clause: "Clause 6.4"
      page: 62
      edition: "2024-2027"
      needs_verification: false
    description: "All-weather ramps with slope <= 1:12, disabled-friendly lifts, and accessible restrooms."
    required_document_types:
      - "BARRIER_FREE_CERT"

  - id: "AICTE-2024-FAC-001"
    name: "Faculty to Student Ratio (FSR)"
    category: "Faculty & Cadre"
    severity: "HIGH"
    citation:
      handbook: "AICTE Approval Process Handbook 2024-2027"
      clause: "Clause 7.1"
      table: "Table 7.1"
      page: 74
      edition: "2024-2027"
      needs_verification: false
    description: "FSR of 1:15 for UG Engineering & Technology programs."
    required_document_types:
      - "FACULTY_MASTER_LIST"
    fsr_target: 15

  - id: "AICTE-2024-FAC-002"
