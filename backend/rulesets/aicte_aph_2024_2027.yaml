    description: "Distribution of Cadre: Professor : Associate Professor : Assistant Professor in 1:2:6 proportion."
    required_document_types:
      - "FACULTY_MASTER_LIST"

  - id: "AICTE-2024-FIN-001"
    name: "Joint FDR Security Deposit"
