version: "2024-2027"
handbook_title: "AICTE Approval Process Handbook 2024-2027"
publisher: "All India Council for Technical Education (AICTE)"
effective_from: "2024-04-01"
rules:
  - id: "AICTE-2024-LAND-001"
    name: "Minimum Contiguous Land Requirement"
    category: "Land & Title"
    severity: "CRITICAL"
    citation:
      handbook: "AICTE Approval Process Handbook 2024-2027"
      clause: "Clause 4.1"
      table: "Table 4.1"
      page: 42
      edition: "2024-2027"
      needs_verification: false
    description: "Technical institution must possess required contiguous land based on location classification."
    required_document_types:
      - "LAND_SALE_DEED"
      - "LAND_LEASE_DEED"
    thresholds:
      "Mega City": 1.5
      "Metro City": 2.0
      "Urban": 2.5
      "Rural": 7.5
    unit: "Acres"
    parameters:
      area_field: "land_area_acres"
      contiguous_field: "is_contiguous"

  - id: "AICTE-2024-LAND-002"
    name: "Land Title and Minimum Lease Period"
    category: "Land & Title"
    severity: "CRITICAL"
    citation:
      handbook: "AICTE Approval Process Handbook 2024-2027"
      clause: "Clause 4.2"
      page: 44
      edition: "2024-2027"
      needs_verification: false
    description: "Land must be owned via Registered Sale Deed or leased from Government for minimum 30 years."
    required_document_types:
      - "LAND_SALE_DEED"
      - "LAND_LEASE_DEED"
    min_lease_years: 30

  - id: "AICTE-2024-LAND-003"
    name: "Land Use and Educational Conversion Order"
    category: "Land & Title"
    severity: "CRITICAL"
    citation:
      handbook: "AICTE Approval Process Handbook 2024-2027"
      clause: "Clause 4.3"
      page: 45
      edition: "2024-2027"
      needs_verification: false
    description: "Conversion Certificate by Competent Revenue Authority designating land for educational use."
    required_document_types:
      - "LAND_USE_CONVERSION_CERT"

  - id: "AICTE-2024-BLD-001"
    name: "Approved Building Sanction Plan"
    category: "Infrastructure"
    severity: "HIGH"
    citation:
      handbook: "AICTE Approval Process Handbook 2024-2027"
      clause: "Clause 5.1"
      page: 51
      edition: "2024-2027"
      needs_verification: false
    description: "Sanctioned Master Plan and Floor Plans approved by Town Planning Authority or Municipal Body."
    required_document_types:
      - "BUILDING_PLAN_APPROVED"

  - id: "AICTE-2024-BLD-002"
    name: "Building Completion and Occupancy Certificate"
    category: "Infrastructure"
    severity: "HIGH"
    citation:
      handbook: "AICTE Approval Process Handbook 2024-2027"
      clause: "Clause 5.3"
      page: 53
      edition: "2024-2027"
      needs_verification: false
    description: "Occupancy Certificate certifying structural safety and completion from competent authority."
